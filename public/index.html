<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PF Tracker | Portfolio & News</title>
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const formatCurrency = value =>
        value.toLocaleString('en-US', { style: 'currency', currency: 'USD' });

      const App = () => {
        const [holdings, setHoldings] = useState([]);
        const [news, setNews] = useState([]);
        const [summary, setSummary] = useState({ totalHoldings: 0, totalCost: 0 });
        const [companies, setCompanies] = useState([]);
        const [prices, setPrices] = useState({});
        const [formState, setFormState] = useState({ symbol: '', shares: '', avgPrice: '' });
        const [status, setStatus] = useState('');
        const [profileName, setProfileName] = useState(
          () => localStorage.getItem('pfProfileName') || 'Your Name'
        );

        const loadData = async () => {
          const [holdingsRes, newsRes, summaryRes, companiesRes] = await Promise.all([
            fetch('/api/holdings'),
            fetch('/api/news'),
            fetch('/api/summary'),
            fetch('/api/companies')
          ]);
          setHoldings(await holdingsRes.json());
          setNews(await newsRes.json());
          setSummary(await summaryRes.json());
          setCompanies(await companiesRes.json());
        };

        useEffect(() => {
          loadData();
        }, []);

        useEffect(() => {
          if (!holdings.length) {
            return;
          }
          const symbols = holdings.map(item => item.symbol).join(',');
          fetch(`/api/prices?symbols=${encodeURIComponent(symbols)}`)
            .then(response => response.json())
            .then(data => {
              const priceMap = data.reduce((acc, item) => {
                acc[item.symbol] = item;
                return acc;
              }, {});
              setPrices(priceMap);
            })
            .catch(() => {
              setPrices({});
            });
        }, [holdings]);

        useEffect(() => {
          localStorage.setItem('pfProfileName', profileName);
        }, [profileName]);

        const totalInvested = useMemo(
          () => holdings.reduce((sum, item) => sum + item.shares * item.avgPrice, 0),
          [holdings]
        );

        const totalMarketValue = useMemo(() => {
          return holdings.reduce((sum, item) => {
            const livePrice = prices[item.symbol]?.price;
            if (!livePrice) {
              return sum;
            }
            return sum + livePrice * item.shares;
          }, 0);
        }, [holdings, prices]);

        const handleSubmit = async event => {
          event.preventDefault();
          setStatus('');
          const payload = {
            symbol: formState.symbol.trim(),
            shares: Number(formState.shares),
            avgPrice: Number(formState.avgPrice)
          };

          if (!payload.symbol || Number.isNaN(payload.shares) || Number.isNaN(payload.avgPrice)) {
            setStatus('Please provide a symbol, shares, and average price.');
            return;
          }

          const response = await fetch('/api/holdings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            setStatus('Unable to save holding. Check the form values.');
            return;
          }

          setFormState({ symbol: '', shares: '', avgPrice: '' });
          setStatus('Holding saved!');
          loadData();
        };

        const removeHolding = async symbol => {
          await fetch(`/api/holdings/${symbol}`, { method: 'DELETE' });
          loadData();
        };

        return (
          <div className="page">
            <header className="hero">
              <div>
                <p className="pill">PF Tracker India</p>
                <h1>{profileName}'s portfolio tracker</h1>
                <p className="subtitle">
                  Track Indian listed companies, update holdings in seconds, and watch live prices
                  alongside market headlines.
                </p>
                <label className="profile-field">
                  Profile name
                  <input
                    value={profileName}
                    onChange={event => setProfileName(event.target.value)}
                    placeholder="Your Name"
                  />
                </label>
              </div>
              <div className="hero-card">
                <h2>Summary</h2>
                <div className="metric">
                  <span>Total holdings</span>
                  <strong>{summary.totalHoldings}</strong>
                </div>
                <div className="metric">
                  <span>Total invested</span>
                  <strong>{formatCurrency(summary.totalCost || totalInvested)}</strong>
                </div>
                <div className="metric">
                  <span>Live market value</span>
                  <strong>{totalMarketValue ? formatCurrency(totalMarketValue) : '—'}</strong>
                </div>
                <div className="metric">
                  <span>Latest refresh</span>
                  <strong>{new Date().toLocaleDateString()}</strong>
                </div>
              </div>
            </header>

            <main className="grid">
              <section className="panel">
                <div className="panel-header">
                  <h2>Your Holdings</h2>
                  <span>{holdings.length} positions</span>
                </div>
                <div className="table">
                  <div className="table-row table-head">
                    <span>Symbol</span>
                    <span>Shares</span>
                    <span>Avg. Price</span>
                    <span>Cost Basis</span>
                    <span>Current Price</span>
                    <span></span>
                  </div>
                  {holdings.map(item => (
                    <div className="table-row" key={item.symbol}>
                      <span className="chip">{item.symbol}</span>
                      <span>{item.shares}</span>
                      <span>{formatCurrency(item.avgPrice)}</span>
                      <span>{formatCurrency(item.shares * item.avgPrice)}</span>
                      <span>
                        {prices[item.symbol]?.price
                          ? formatCurrency(prices[item.symbol].price)
                          : '—'}
                      </span>
                      <button onClick={() => removeHolding(item.symbol)}>Remove</button>
                    </div>
                  ))}
                </div>
              </section>

              <section className="panel form-panel">
                <h2>Add or Update a Holding</h2>
                <form onSubmit={handleSubmit}>
                  <label>
                    Listed company
                    <input
                      value={formState.symbol}
                      onChange={event =>
                        setFormState({ ...formState, symbol: event.target.value.toUpperCase() })
                      }
                      list="company-options"
                      placeholder="RELIANCE.NS"
                    />
                    <datalist id="company-options">
                      {companies.map(company => (
                        <option
                          key={company.symbol}
                          value={company.symbol}
                        >{`${company.name} (${company.symbol})`}</option>
                      ))}
                    </datalist>
                  </label>
                  <label>
                    Shares
                    <input
                      type="number"
                      step="0.01"
                      value={formState.shares}
                      onChange={event => setFormState({ ...formState, shares: event.target.value })}
                      placeholder="10"
                    />
                  </label>
                  <label>
                    Average price
                    <input
                      type="number"
                      step="0.01"
                      value={formState.avgPrice}
                      onChange={event => setFormState({ ...formState, avgPrice: event.target.value })}
                      placeholder="182.45"
                    />
                  </label>
                  <button type="submit">Save holding</button>
                </form>
                {status && <p className="status">{status}</p>}
              </section>

              <section className="panel news-panel">
                <div className="panel-header">
                  <h2>Latest Market News</h2>
                  <span>Tracking {news.length} headlines</span>
                </div>
                <div className="news-list">
                  {news.map(item => (
                    <article key={item.id}>
                      <p className="news-source">{item.source}</p>
                      <h3>{item.title}</h3>
                      <div className="news-meta">
                        <span>{item.symbol}</span>
                        <span>{new Date(item.publishedAt).toLocaleDateString()}</span>
                      </div>
                    </article>
                  ))}
                </div>
              </section>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
